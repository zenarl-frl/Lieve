[package]
name = "lieve"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58", features = ["Foundation", "Media_Control", "Foundation_Collections", "Web_Http", "Data_Json", "Win32_System_WinRT"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

